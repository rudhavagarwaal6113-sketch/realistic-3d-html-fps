<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>IRONLINE — 3D FPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu" class="screen">
    <div class="panel">
      <div class="eyebrow">WEBGL COMBAT SIMULATION</div>
      <h1>IRONLINE</h1>
      <p>Realistic browser FPS prototype. Built for desktop mouse + keyboard.</p>
      <button id="start">DEPLOY</button>
      <div class="controls">WASD MOVE · SHIFT SPRINT · CTRL CROUCH · RMB AIM · LMB FIRE · R RELOAD · ESC PAUSE</div>
    </div>
  </div>
  <div id="hud" class="hidden">
    <div class="topbar"><span>IRONLINE // TRAINING RANGE</span><span id="status">LIVE</span></div>
    <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
    <div id="hitmarker">×</div>
    <div class="bottom">
      <div><span class="label">HEALTH</span><strong id="health">100</strong><div class="bar"><b id="healthBar"></b></div></div>
      <div class="ammo"><strong id="ammo">30</strong><span>/ 120</span><small id="weaponState">READY</small></div>
    </div>
    <div id="feed"></div>
  </div>
  <div id="pause" class="screen hidden"><div class="panel"><div class="eyebrow">SYSTEM PAUSED</div><h2>HOLD POSITION</h2><button id="resume">RESUME</button></div></div>
  <script type="module" src="game.js"></script>
</body>
</html>
